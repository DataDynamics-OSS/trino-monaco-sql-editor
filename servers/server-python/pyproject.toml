[project]
name = "trino-monaco-gateway"
version = "0.0.1"
description = "Reference gateway for trino-monaco: per-user Trino sessions over HTTP (FastAPI + httpx)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
trino-monaco-gateway = "trino_monaco_gateway.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trino_monaco_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

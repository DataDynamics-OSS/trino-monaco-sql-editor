# Same environment variables as the Node gateway (servers/server-node/README.md).
# Every gateway.* setting can also be set the Spring way (application.yml, --gateway.x=..., GATEWAY_X=...).
spring.application.name=trino-monaco-gateway
spring.main.banner-mode=off
spring.threads.virtual.enabled=true

server.address=${GATEWAY_HOST:127.0.0.1}
server.port=${GATEWAY_PORT:8787}

gateway.prefix=${GATEWAY_PREFIX:/api}
gateway.clusters-json=${TRINO_CLUSTERS:}
gateway.secure-cookie=${SECURE_COOKIE:true}
gateway.allow-ddl=${ALLOW_DDL:true}
gateway.allow-header-auth=${ALLOW_HEADER_AUTH:false}
gateway.idle-timeout=${IDLE_TIMEOUT_MIN:30}m
gateway.request-timeout=${REQUEST_TIMEOUT_SEC:300}s
gateway.max-sessions-per-user=${MAX_SESSIONS_PER_USER:3}
